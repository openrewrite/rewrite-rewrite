---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.recipes.rewrite.AddBuildSettingsPlugin
displayName: Add the OpenRewrite build settings plugin
description: >-
  Apply `org.openrewrite.build.settings` in `settings.gradle`, so that plugin resolution can reach the Code Genome
  Project. A plugin's classpath resolves from the repositories settings declares, before any project exists, and those
  default to the Gradle Plugin Portal — which proxies Maven Central, where `org.openrewrite` artifacts no longer are.
  `org.openrewrite.build.recipe-repositories` cannot do this: it is a project plugin, and the resolution that fails
  happens before it can run. Only repositories that apply an `org.openrewrite.build.*` plugin need this.
recipeList:
  - org.openrewrite.gradle.plugins.AddSettingsPlugin:
      pluginId: org.openrewrite.build.settings
      version: latest.release
