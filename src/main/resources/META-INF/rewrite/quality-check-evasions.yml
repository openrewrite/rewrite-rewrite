---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.FindQualityCheckEvasionsInRecipes
displayName: Find ways recipe code gets past `rewriteRun` quality checks
description: >-
  Finds recipe code that keeps state on the `ExecutionContext`, reuses a marker of rewrite's own recipes
  to carry information, rebuilds a `JavaSourceSet` from a few of its fields, or adds to the recipes that made changes in
  a cycle to force another. Each finding says what to do instead.
recipeList:
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.ExecutionContext computeMessageIfAbsent(..)
      matchOverrides: true
      advice: Keep state across source files in a `ScanningRecipe` accumulator, and within one source file in cursor messages, rather than on the `ExecutionContext` a run shares
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.ExecutionContext getMessages()
      matchOverrides: true
      advice: Keep state across source files in a `ScanningRecipe` accumulator, and within one source file in cursor messages, rather than on the `ExecutionContext` a run shares
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.marker.AlreadyReplaced <constructor>(..)
      advice: Check the tree for the change already made, rather than reusing the marker rewrite's own `FindAndReplace` uses to carry information
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.java.marker.JavaSourceSet build(..)
      advice: Derive the new `JavaSourceSet` from the existing marker with its `with` methods, so it keeps the classpath and type information it already carries
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.java.marker.JavaSourceSet <constructor>(..)
      advice: Derive the new `JavaSourceSet` from the existing marker with its `with` methods, so it keeps the classpath and type information it already carries
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.scheduling.RecipeRunCycle getMadeChangesInThisCycle()
      advice: Finish the change within the cycle, for instance with `doAfterVisit`, rather than forcing another cycle through scheduler internals
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.FindQualityCheckEvasionsInTests
displayName: Find ways recipe tests get past `rewriteRun` quality checks
description: >-
  Finds recipe tests that pin the cycles `rewriteRun` runs, which can skip the cycle that checks a recipe settles, and
  tests that turn a recipe quality check off. Each finding says what to do instead.
recipeList:
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.test.RecipeSpec cycles(int)
      advice: 'Drop `cycles(..)`: `rewriteRun` already runs one cycle past `expectedCyclesThatMakeChanges`, and that extra cycle checks the recipe settles'
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.test.RecipeQualityValidation.RecipeQualityValidationBuilder *(boolean)
      advice: Fix what this quality check reports in the recipe, rather than turning the check off in the test
  - org.openrewrite.java.recipes.FindMethodsWithAdvice:
      methodPattern: org.openrewrite.test.TypeValidation none()
      advice: Fix the missing types, or relax only the type validation that fails, rather than turning all of it off
