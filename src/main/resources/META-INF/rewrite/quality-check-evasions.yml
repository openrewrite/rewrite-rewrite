---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.FindQualityCheckEvasions
displayName: Find ways recipes get past `rewriteRun` quality checks
description: >-
  Finds code that gets a recipe past a `rewriteRun` quality check without fixing what the check guards: state kept on
  the `ExecutionContext`, markers rewrite's own recipes use carrying a recipe's information,
  source sets rebuilt without their classpath, cycles forced through scheduler internals, and tests that pin cycles or
  turn checks off. Each finding says what to do instead, and is worth a look rather than necessarily a defect.
recipeList:
  - org.openrewrite.java.recipes.FindQualityCheckEvasionsInRecipes
  - org.openrewrite.java.recipes.FindQualityCheckEvasionsInTests
